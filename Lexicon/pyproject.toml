[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "lectura-lexicon"
version = "1.0.0"
description = "French and English lexical functions (validity, frequency, pronunciations, homophones, rhymes, conjugation, search) through the Lectura public API or a local database (no database included)"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
license-files = ["LICENCE.txt", "NOTICE", "ATTRIBUTION.md"]
authors = [{name = "Maxime Carrière (Lectura)", email = "admin@lectura.world"}]
keywords = [
    "french", "english", "lexicon", "lexique", "nlp", "dictionary", "phonetics", "ipa", "homophones",
    "rhymes", "conjugation", "morphology", "lexik",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: French",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
lectura-lexicon = "lectura_lexicon.__main__:main"

[project.urls]
Homepage = "https://www.lectura.world/developpement/modules/"
Documentation = "https://www.lectura.world/developpement/modules/"
Repository = "https://github.com/maxcarriere/lectura-modules-v1"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lectura_lexicon = ["py.typed"]
"lectura_lexicon.v0" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
